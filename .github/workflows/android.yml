name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  export:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.4

    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.4.stable \
             ~/.local/share/godot/export_templates/4.4.stable || true

      - name: Configure Android
        run: |
          mkdir -p /root/.android
          mkdir -p /root/.config/godot

          keytool -keyalg RSA \
            -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore /root/.android/debug.keystore \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 10000

          JAVA_BIN="$(command -v java)"
          JAVA_HOME_DIR="$(dirname "$(dirname "$(readlink -f "$JAVA_BIN")")")"

          cat > /root/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/debug_keystore = "/root/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "JAVA_HOME_DIR=$JAVA_HOME_DIR"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -l /root/.android/debug.keystore

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/MurimRPG.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MurimRPG-Android
          path: build/MurimRPG.apk
