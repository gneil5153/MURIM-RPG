name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.4

    steps:
      - uses: actions/checkout@v4

      - name: Configure Android debug signing
        run: |
          mkdir -p /root/.android /root/.config/godot
          keytool -genkeypair -v -keystore /root/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # Godot 4.4 reads editor_settings-4.4.tres.
          cat > /root/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "/root/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/javac

      - name: Import project
        run: godot --headless --path . --import

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/MurimRPG.apk
          test -s build/MurimRPG.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MurimRPG-Android
          path: build/MurimRPG.apk
          if-no-files-found: error
