name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.4

    steps:
      - uses: actions/checkout@v4

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Configure Android debug signing
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/4.4.stable \
            "$HOME/.local/share/godot/export_templates/"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # Godot 4.4 reads editor_settings-4.4.tres.
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/javac

      - name: Import project
        run: godot --headless --path . --import

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/MurimRPG.apk
          test -s build/MurimRPG.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MurimRPG-Android
          path: build/MurimRPG.apk
          if-no-files-found: error
